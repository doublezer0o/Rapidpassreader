name: Build Rapid Reader APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 4 -type f -iname 'RapidReader-Android-Starter.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "RapidReader-Android-Starter.zip not found. Upload it to the repository."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="extracted/rapid-reader"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Android project folder not found inside ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Align Java and Kotlin JVM targets to 17
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle"
          s = p.read_text()
          marker = "    defaultConfig {"
          if "compileOptions" not in s:
              s = s.replace("}\n", "}\n", 1)
              # Insert the compile and Kotlin target settings before the android block's final brace.
              idx = s.rfind("}")
              s = s[:idx] + "\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = '17'\n    }\n" + s[idx:]
          p.write_text(s)
          print("Updated app/build.gradle JVM targets to Java/Kotlin 17")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RapidReader-debug-apk
          path: extracted/rapid-reader/app/build/outputs/apk/debug/app-debug.apk
